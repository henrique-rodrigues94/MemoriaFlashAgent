name: content-agent

on:
  schedule:
    - cron: '7 3 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo do Agent'
        required: true
        default: automatic
        type: choice
        options:
          - automatic
          - correction
          - update_requested
          - discover_new
          - cleanup
      cleanup_apply:
        description: 'No modo cleanup, realmente apagar candidatos (false = dry-run)'
        required: true
        default: false
        type: boolean
      discovery_enabled:
        description: 'Permitir descoberta de novos conteúdos'
        required: true
        default: false
        type: boolean

concurrency:
  group: content-agent-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Executar Content Agent
        run: node dist/content-agent.cjs
        env:
          NODE_ENV: production
          CONTENT_AGENT_PRODUCTION_STRICT: 'true'
          CONTENT_AGENT_MODE: ${{ inputs.mode || secrets.CONTENT_AGENT_MODE || 'automatic' }}
          CONTENT_AGENT_DISCOVERY_ENABLED: ${{ inputs.discovery_enabled || secrets.CONTENT_AGENT_DISCOVERY_ENABLED || 'false' }}
          CONTENT_AGENT_CLEANUP_ENABLED: ${{ inputs.mode == 'cleanup' || secrets.CONTENT_AGENT_CLEANUP_ENABLED || 'false' }}
          CONTENT_AGENT_CLEANUP_APPLY: ${{ inputs.cleanup_apply || 'false' }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GEMINI_MAX_OUTPUT_TOKENS: ${{ secrets.GEMINI_MAX_OUTPUT_TOKENS || '12000' }}
          GEMINI_MAX_COST_USD_PER_RUN: ${{ secrets.GEMINI_MAX_COST_USD_PER_RUN || '0.50' }}
          GEMINI_INPUT_PRICE_PER_MILLION: ${{ secrets.GEMINI_INPUT_PRICE_PER_MILLION || '0.30' }}
          GEMINI_OUTPUT_PRICE_PER_MILLION: ${{ secrets.GEMINI_OUTPUT_PRICE_PER_MILLION || '2.50' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
          DEEPSEEK_MAX_OUTPUT_TOKENS: ${{ secrets.DEEPSEEK_MAX_OUTPUT_TOKENS || '8192' }}
          DEEPSEEK_THINKING: ${{ secrets.DEEPSEEK_THINKING || 'false' }}
          DEEPSEEK_MAX_COST_USD_PER_RUN: ${{ secrets.DEEPSEEK_MAX_COST_USD_PER_RUN || '0.50' }}
          DEEPSEEK_MAX_COST_USD_PER_CALL: ${{ secrets.DEEPSEEK_MAX_COST_USD_PER_CALL || '0.25' }}
          DEEPSEEK_INPUT_CACHE_HIT_PRICE_PER_MILLION: ${{ secrets.DEEPSEEK_INPUT_CACHE_HIT_PRICE_PER_MILLION || '0.0028' }}
          DEEPSEEK_INPUT_PRICE_PER_MILLION: ${{ secrets.DEEPSEEK_INPUT_PRICE_PER_MILLION || '0.14' }}
          DEEPSEEK_OUTPUT_PRICE_PER_MILLION: ${{ secrets.DEEPSEEK_OUTPUT_PRICE_PER_MILLION || '0.28' }}
          DEEPSEEK_TIMEOUT: ${{ secrets.DEEPSEEK_TIMEOUT || '60000' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_REASONING_EFFORT: ${{ secrets.OPENAI_REASONING_EFFORT }}
          OPENAI_MAX_OUTPUT_TOKENS: ${{ secrets.OPENAI_MAX_OUTPUT_TOKENS }}
          OPENAI_MAX_COST_USD_PER_RUN: ${{ secrets.OPENAI_MAX_COST_USD_PER_RUN }}
          OPENAI_INPUT_PRICE_PER_MILLION: ${{ secrets.OPENAI_INPUT_PRICE_PER_MILLION }}
          OPENAI_CACHED_INPUT_PRICE_PER_MILLION: ${{ secrets.OPENAI_CACHED_INPUT_PRICE_PER_MILLION }}
          OPENAI_OUTPUT_PRICE_PER_MILLION: ${{ secrets.OPENAI_OUTPUT_PRICE_PER_MILLION }}
          OPENAI_TIMEOUT: ${{ secrets.OPENAI_TIMEOUT }}
          CONTENT_AGENT_ENABLED: ${{ secrets.CONTENT_AGENT_ENABLED || 'true' }}
          CONTENT_AGENT_TIMEZONE: 'America/Campo_Grande'
          CONTENT_AGENT_SUBJECTS: ${{ secrets.CONTENT_AGENT_SUBJECTS }}
          CONTENT_AGENT_MIN_CARDS: ${{ secrets.CONTENT_AGENT_MIN_CARDS }}
          CONTENT_AGENT_TARGET_CARDS: ${{ secrets.CONTENT_AGENT_TARGET_CARDS }}
          CONTENT_AGENT_MAX_CARDS: ${{ secrets.CONTENT_AGENT_MAX_CARDS }}
          CONTENT_AGENT_CARD_TYPES: ${{ secrets.CONTENT_AGENT_CARD_TYPES }}
          CONTENT_AGENT_MAX_RUNTIME_MIN: ${{ secrets.CONTENT_AGENT_MAX_RUNTIME_MIN }}
          CONTENT_AGENT_MAX_CARDS_PER_RUN: ${{ secrets.CONTENT_AGENT_MAX_CARDS_PER_RUN }}
          CONTENT_AGENT_MAX_AI_CALLS: ${{ secrets.CONTENT_AGENT_MAX_AI_CALLS }}
          CONTENT_AGENT_MAX_TOPICS: ${{ secrets.CONTENT_AGENT_MAX_TOPICS }}
          CONTENT_AGENT_MAX_RETRIES: ${{ secrets.CONTENT_AGENT_MAX_RETRIES }}
          CONTENT_AGENT_REQUEST_TIMEOUT_MIN: ${{ secrets.CONTENT_AGENT_REQUEST_TIMEOUT_MIN }}
          CONTENT_AGENT_BATCH_SIZE: ${{ secrets.CONTENT_AGENT_BATCH_SIZE }}
          CONTENT_AGENT_MAX_CARDS_REVIEWED: ${{ secrets.CONTENT_AGENT_MAX_CARDS_REVIEWED }}
          CONTENT_AGENT_CARD_MIN_FEEDBACK: ${{ secrets.CONTENT_AGENT_CARD_MIN_FEEDBACK }}
          CONTENT_AGENT_CARD_MIN_NEGATIVE_RATE: ${{ secrets.CONTENT_AGENT_CARD_MIN_NEGATIVE_RATE }}
          CONTENT_AGENT_MAX_REQUESTS: ${{ secrets.CONTENT_AGENT_MAX_REQUESTS }}
          CONTENT_AGENT_MAX_REQUEST_TOPICS: ${{ secrets.CONTENT_AGENT_MAX_REQUEST_TOPICS }}
          CONTENT_AGENT_MAX_FEEDBACK_CARDS: ${{ secrets.CONTENT_AGENT_MAX_FEEDBACK_CARDS }}
          CONTENT_AGENT_MAX_DISCOVERY_SUBJECTS: ${{ secrets.CONTENT_AGENT_MAX_DISCOVERY_SUBJECTS }}
          CONTENT_AGENT_MAX_CLEANUP_CARDS: ${{ secrets.CONTENT_AGENT_MAX_CLEANUP_CARDS }}
          CONTENT_AGENT_CLEANUP_STALE_DAYS: ${{ secrets.CONTENT_AGENT_CLEANUP_STALE_DAYS }}
          CONTENT_AGENT_CLEANUP_MIN_KEEP: ${{ secrets.CONTENT_AGENT_CLEANUP_MIN_KEEP }}
          CONTENT_AGENT_CLEANUP_USAGE_WINDOW_DAYS: ${{ secrets.CONTENT_AGENT_CLEANUP_USAGE_WINDOW_DAYS }}
